name: DATN

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: postgres:16-alpine
    container_name: datn-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-AIinterview}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - datn_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - datn-network

  backend:
    container_name: datn-backend
    build:
      context: ./backend/python-training/chat-backend
      dockerfile: Dockerfile.datn
    env_file:
      - ./backend/python-training/chat-backend/app/configuration/.env
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER:-database}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-AIinterview}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      READ_ONLY_POSTGRES_SERVER: ${READ_ONLY_POSTGRES_SERVER:-${POSTGRES_SERVER:-database}}
      READ_ONLY_POSTGRES_PORT: ${READ_ONLY_POSTGRES_PORT:-${POSTGRES_PORT:-5432}}
      READ_ONLY_POSTGRES_DB: ${POSTGRES_DB:-AIinterview}
      READ_ONLY_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      READ_ONLY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      READ_ONLY_POSTGRES_SSL_MODE: ${READ_ONLY_POSTGRES_SSL_MODE:-${POSTGRES_SSL_MODE:-disable}}
      LOCAL_WHISPER_URL: ${LOCAL_WHISPER_URL:-http://ai-service:8001/api/v1/stt/transcribe}
      TESSERACT_CMD: /usr/bin/tesseract
    ports:
      - "8000:8000"
    volumes:
      - datn_uploads:/app/uploads
    command: >
      sh -c "alembic -c /app/alembic.ini upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - datn-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: datn-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123456}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - datn_pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tools"]
    logging: *default-logging
    networks:
      - datn-network

  frontend:
    container_name: datn-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.datn
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-/ai-api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - datn-network

  ai-service:
    container_name: datn-ai-service
    build:
      context: ../AI
      dockerfile: Dockerfile
    env_file:
      - ../AI/.env
    environment:
      AI_LITE_MODE: "true"
      DEBUG: "false"
      CHROMA_DB_PATH: /app/db/chroma
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8001:8001"
    volumes:
      - datn_ai_cache:/home/app/.cache
      - datn_ai_data:/app/db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - datn-network

volumes:
  datn_db_data:
  datn_pgadmin_data:
  datn_uploads:
  datn_ai_cache:
  datn_ai_data:

networks:
  datn-network:

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.datn"

[deploy]
startCommand = "sh -c \"alembic -c /app/alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}\""
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
